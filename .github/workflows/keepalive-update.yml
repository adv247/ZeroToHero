name: Keepalive & Node Version Update

on:
  schedule:
    - cron: "0 0 * * 0" # Chủ nhật hàng tuần, 00:00 UTC
  workflow_dispatch:

concurrency:
  group: keepalive-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Tạo commit heartbeat (không phụ thuộc action bên thứ 3)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/.keepalive
          git config user.name "cgps-bot"
          git config user.email "cgps-bot@users.noreply.github.com"
          git add .github/.keepalive
          if git diff --cached --quiet; then
            echo "Không có gì thay đổi (hiếm khi xảy ra) - bỏ qua commit."
            exit 0
          fi

          if git commit -m "chore: keepalive heartbeat $(date -u +%Y-%m-%d)" && git push; then
            echo "✅ Đã tạo commit heartbeat qua git - reset đồng hồ 60 ngày của GitHub."
          else
            echo "⚠️ git push thất bại - chuyển sang phương án dự phòng: GitHub REST API..."
            CONTENT_B64=$(base64 -w0 .github/.keepalive)
            SHA=$(gh api "repos/${{ github.repository }}/contents/.github/.keepalive" --jq .sha 2>/dev/null || echo "")
            if [ -n "$SHA" ]; then
              gh api --method PUT "repos/${{ github.repository }}/contents/.github/.keepalive" \
                -f message="chore: keepalive heartbeat (REST API fallback) $(date -u +%Y-%m-%d)" \
                -f content="$CONTENT_B64" -f sha="$SHA" -f branch="${{ github.ref_name }}"
            else
              gh api --method PUT "repos/${{ github.repository }}/contents/.github/.keepalive" \
                -f message="chore: keepalive heartbeat (REST API fallback) $(date -u +%Y-%m-%d)" \
                -f content="$CONTENT_B64" -f branch="${{ github.ref_name }}"
            fi
            echo "✅ Đã tạo commit heartbeat qua REST API (phương án dự phòng) - reset đồng hồ 60 ngày."
          fi

      - name: Ping giám sát riêng cho Keepalive (tuỳ chọn)
        if: ${{ env.PING_URL_KEEPALIVE != '' }}
        env:
          PING_URL_KEEPALIVE: ${{ secrets.PING_URL_KEEPALIVE }}
        run: curl -fsS "$PING_URL_KEEPALIVE" || true

  update-node-version:
    needs: keepalive
    if: ${{ always() && (needs.keepalive.result == 'success' || needs.keepalive.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changed: ${{ steps.node_lts.outputs.changed }}
      version: ${{ steps.node_lts.outputs.version }}
      commit_sha: ${{ steps.push.outputs.commit_sha }}
    steps:
      - name: Generate GitHub App token
        id: app_token
        if: ${{ env.APP_ID != '' && env.APP_PRIVATE_KEY != '' }}
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ steps.app_token.outputs.token || secrets.BOT_PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Get latest Node.js LTS version
        id: node_lts
        run: |
          set -e
          LATEST_LTS=$(curl -fsS https://nodejs.org/dist/index.json | jq -r '[.[] | select(.lts != false)][0].version' | sed 's/^v//')

          if [ -z "$LATEST_LTS" ] || [ "$LATEST_LTS" = "null" ]; then
            echo "::error::Không lấy được phiên bản LTS từ nodejs.org"
            exit 1
          fi

          CURRENT="$(cat .node-version 2>/dev/null || echo '')"
          echo "Phiên bản LTS mới nhất: $LATEST_LTS (hiện tại: ${CURRENT:-chưa có})"
          echo "$LATEST_LTS" > .node-version

          echo "version=$LATEST_LTS" >> "$GITHUB_OUTPUT"
          if [ "$LATEST_LTS" != "$CURRENT" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import GPG key (tuỳ chọn)
        if: ${{ steps.node_lts.outputs.changed == 'true' && env.GPG_PRIVATE_KEY != '' && env.GPG_PASSPHRASE != '' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Commit và push .node-version (tự phục hồi 2 lớp)
        id: push
        if: steps.node_lts.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.BOT_PAT_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_VERSION: ${{ steps.node_lts.outputs.version }}
          COMMIT_NAME: ${{ steps.app_token.outputs.app-slug && format('{0}[bot]', steps.app_token.outputs.app-slug) || 'cgps-bot' }}
          COMMIT_EMAIL: ${{ steps.app_token.outputs.app-slug && format('{0}[bot]@users.noreply.github.com', steps.app_token.outputs.app-slug) || 'cgps-bot@users.noreply.github.com' }}
        run: |
          set -e
          git config user.name "$COMMIT_NAME"
          git config user.email "$COMMIT_EMAIL"
          git add .node-version
          git commit -m "chore: cập nhật .node-version lên bản LTS mới nhất ($NODE_VERSION)"

          PUSHED=false
          for attempt in 1 2 3; do
            if git push origin HEAD:"${{ github.ref_name }}"; then
              PUSHED=true
              break
            fi
            echo "⚠️ Push thất bại (lần $attempt/3) - có thể do commit khác vừa chen vào. Đang pull --rebase rồi thử lại..."
            git pull --rebase origin "${{ github.ref_name }}" || true
            sleep 5
          done

          if [ "$PUSHED" = "true" ]; then
            COMMIT_SHA=$(git rev-parse HEAD)
            echo "✅ Push trực tiếp lên ${{ github.ref_name }} thành công. Commit hash: $COMMIT_SHA"
            echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
            echo "method=direct_push" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "⚠️ Push trực tiếp thất bại sau 3 lần thử - có thể do main đã bật 'Require pull request'."
          echo "Chuyển sang phương án dự phòng: tạo nhánh riêng + Pull Request tự động merge..."

          BRANCH_NAME="bot/update-node-version-${{ github.run_id }}"
          git checkout -b "$BRANCH_NAME"
          git push origin "$BRANCH_NAME"

          PR_URL=$(gh pr create \
            --title "chore: cập nhật .node-version lên bản LTS mới nhất ($NODE_VERSION)" \
            --body "Tự động tạo bởi workflow \`keepalive-update.yml\` (run ${{ github.run_id }})." \
            --base "${{ github.ref_name }}" \
            --head "$BRANCH_NAME")
          echo "Đã tạo Pull Request: $PR_URL"

          gh pr merge --auto --squash "$PR_URL" || \
            echo "::warning::Không thể tự động bật auto-merge. Vui lòng merge tay: $PR_URL"

          COMMIT_SHA=$(git rev-parse HEAD)
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "method=pull_request" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Thông báo Telegram - cập nhật thành công
        if: ${{ steps.node_lts.outputs.changed == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_TO }}
          COMMIT_SHA: ${{ steps.push.outputs.commit_sha }}
          PR_URL: ${{ steps.push.outputs.pr_url }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Chưa cấu hình TELEGRAM_TOKEN/TELEGRAM_TO, bỏ qua thông báo."
            exit 0
          fi
          EXTRA_LINE=""
          if [ -n "$PR_URL" ]; then
            EXTRA_LINE="🔗 Pull Request: $PR_URL"
          fi
          PAYLOAD=$(jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg line1 "🔔 CGPS" \
            --arg line2 "✅ Đã cập nhật .node-version lên bản LTS mới nhất: ${{ steps.node_lts.outputs.version }}" \
            --arg line3 "🔖 Commit hash: ${COMMIT_SHA:-N/A}" \
            --arg line4 "$EXTRA_LINE" \
            '{chat_id: $chat_id, text: ($line1 + "\n" + $line2 + "\n" + $line3 + ($line4 != "" then ("\n" + $line4) else "" end)), parse_mode: "HTML"}')
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" > /dev/null

  notify-on-failure:
    needs: [keepalive, update-node-version]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Thông báo Telegram - lỗi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_TO }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Chưa cấu hình TELEGRAM_TOKEN/TELEGRAM_TO, bỏ qua thông báo."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg line1 "🔔 CGPS" \
            --arg line2 "❌ Workflow Keepalive & Node Version Update thất bại." \
            --arg line3 "Xem log: $RUN_URL" \
            '{chat_id: $chat_id, text: ($line1 + "\n" + $line2 + "\n" + $line3), parse_mode: "HTML"}')
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" > /dev/null
